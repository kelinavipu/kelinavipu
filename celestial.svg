<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150">
  <defs>
    <style>
      .star {
        fill: #F0F4F8;
        animation: twinkle infinite alternate ease-in-out;
      }
      .s1 { animation-duration: 3s; animation-delay: -1s; }
      .s2 { animation-duration: 4s; animation-delay: -2s; }
      .s3 { animation-duration: 5s; animation-delay: -3s; }
      .s4 { animation-duration: 2.5s; animation-delay: -0.5s; }
      @keyframes twinkle {
        0% { opacity: 0.1; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1.3); }
      }
      .shooting-star {
        fill: url(#grad);
        opacity: 0;
      }
      .shoot-1 { animation: shoot 8s infinite linear -2s; }
      .shoot-2 { animation: shoot 12s infinite linear -7s; }
      @keyframes shoot {
        0% { transform: translate(120%, -20%) rotate(-30deg); opacity: 1; }
        10% { transform: translate(-20%, 120%) rotate(-30deg); opacity: 0; }
        100% { transform: translate(-20%, 120%) rotate(-30deg); opacity: 0; }
      }
    </style>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <!-- Twinkling Stars -->
  <circle cx="10%" cy="20%" r="1" class="star s1" />
  <circle cx="25%" cy="15%" r="1.5" class="star s2" />
  <circle cx="40%" cy="30%" r="1" class="star s3" />
  <circle cx="60%" cy="10%" r="2" class="star s4" />
  <circle cx="80%" cy="25%" r="1.5" class="star s1" />
  <circle cx="90%" cy="10%" r="1" class="star s2" />
  <circle cx="15%" cy="60%" r="1.5" class="star s3" />
  <circle cx="30%" cy="80%" r="1" class="star s4" />
  <circle cx="50%" cy="70%" r="2" class="star s1" />
  <circle cx="70%" cy="85%" r="1" class="star s2" />
  <circle cx="85%" cy="65%" r="1.5" class="star s3" />
  <circle cx="95%" cy="50%" r="1" class="star s4" />
  <circle cx="5%" cy="90%" r="1.5" class="star s1" />
  <circle cx="45%" cy="40%" r="1" class="star s2" />
  <circle cx="65%" cy="45%" r="1.5" class="star s3" />
  <circle cx="75%" cy="35%" r="1" class="star s4" />
  <circle cx="35%" cy="55%" r="1.5" class="star s1" />
  <circle cx="20%" cy="35%" r="1" class="star s2" />
  <circle cx="55%" cy="25%" r="1" class="star s3" />
  <circle cx="85%" cy="90%" r="1.5" class="star s4" />
  <circle cx="12%" cy="45%" r="1" class="star s1" />
  <circle cx="28%" cy="5%" r="1.5" class="star s2" />
  <circle cx="48%" cy="15%" r="1" class="star s3" />
  <circle cx="68%" cy="20%" r="1.5" class="star s4" />
  <circle cx="88%" cy="45%" r="1" class="star s1" />
  <circle cx="98%" cy="85%" r="1.5" class="star s2" />
  <circle cx="78%" cy="5%" r="1" class="star s3" />
  <circle cx="38%" cy="85%" r="1.5" class="star s4" />
  <circle cx="58%" cy="55%" r="1" class="star s1" />
  <circle cx="22%" cy="75%" r="1.5" class="star s2" />

  <!-- Shooting Stars -->
  <ellipse cx="0" cy="0" rx="80" ry="1.5" class="shooting-star shoot-1" />
  <ellipse cx="0" cy="0" rx="100" ry="2" class="shooting-star shoot-2" />
</svg>
